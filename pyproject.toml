[project]
name = "doc-intelligent-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pdfplumber",
    "httpx",
    "chromadb",
    "python-dotenv",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "google-generativeai>=0.8.0",
    "fpdf2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["app/src/core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"